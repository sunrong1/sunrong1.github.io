name: Deploy Blog to GitHub Pages

on:
  push:
    branches:
      - master  # 推送到 master 分支时触发

  # 允许手动触发
  workflow_dispatch:

# 官方 Pages 部署需要的权限
# id-token: write 是 actions/deploy-pages 做 OIDC 认证用的,不能少
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取所有历史记录

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with VuePress
        run: npm run build
        env:
          NODE_ENV: production
          # 文章数量增长会推高 vuepress-vite 的构建内存
          # GitHub runner 约 7GB 内存，堆设 6144MB 留出系统余量
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Copy CNAME
        run: cp CNAME src/.vuepress/dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./src/.vuepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
