name: Deploy Blog to GitHub Pages

on:
  push:
    branches:
      - master  # 推送到 master 分支时触发

  # 允许手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限
permissions:
  contents: write  # 需要推送 gh-pages 分支

# 只允许一个并发部署任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取所有历史记录

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with VuePress
        run: npm run build
        env:
          NODE_ENV: production
          # 151 篇文章构建时 vuepress-vite 会吃满 Node 堆
          # GitHub runner 约 7GB 内存，堆设 6144MB 留出系统余量
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Copy CNAME
        run: cp CNAME src/.vuepress/dist/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./src/.vuepress/dist
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: auto deploy from master branch'
